name: CI Maxi Cream
on: [push]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import sys; sys.path.insert(0, 'src'); import taller8_maxicream; print('Import OK, la clase Producto carga sin errores')"
